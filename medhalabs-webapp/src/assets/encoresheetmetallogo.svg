<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="320" height="90">
  <!-- Red house icon -->
  <g transform="translate(0, 5)">
    <!-- Roof (chevron shape) -->
    <polyline points="10,52 48,14 86,52" fill="none" stroke="#CC1B1B" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Left wall -->
    <line x1="18" y1="52" x2="18" y2="78" stroke="#CC1B1B" stroke-width="8" stroke-linecap="round"/>
    <!-- Bottom bar -->
    <line x1="18" y1="78" x2="62" y2="78" stroke="#CC1B1B" stroke-width="8" stroke-linecap="round"/>
    <!-- Right wall (partial - goes up then stops) -->
    <line x1="78" y1="52" x2="78" y2="65" stroke="#CC1B1B" stroke-width="8" stroke-linecap="round"/>
    <!-- Inner step -->
    <line x1="62" y1="78" x2="62" y2="65" stroke="#CC1B1B" stroke-width="8" stroke-linecap="round"/>
    <line x1="62" y1="65" x2="78" y2="65" stroke="#CC1B1B" stroke-width="8" stroke-linecap="round"/>
  </g>
  <!-- ENCORE text -->
  <text x="100" y="58" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="42" fill="#1a1a1a" letter-spacing="1">ENCORE</text>
  <!-- SHEETMETAL text -->
  <text x="103" y="76" font-family="Arial, sans-serif" font-weight="400" font-size="13" fill="#1a1a1a" letter-spacing="5">SHEETMETAL</text>
</svg>
